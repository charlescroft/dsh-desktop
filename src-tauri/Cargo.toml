[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Standalone Tauri desktop shell for the DeepSeek Harness (dsh) web profile"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sys-locale = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
