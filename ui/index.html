<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
    <script>
      // Resolve the theme before first paint: URL parameter (baked in by the
      // shell from dsh's ui-theme preference) > cached preference > OS
      // setting. Also paints the window background to match so navigation
      // gaps never flash the wrong theme.
      function applyTheme(preference) {
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.setAttribute("data-ds-dark-theme", "");
          document.body.setAttribute("data-ds-dark-theme", "");
        } else {
          document.documentElement.removeAttribute("data-ds-dark-theme");
          document.body.removeAttribute("data-ds-dark-theme");
        }
        try {
          window.__TAURI__?.core?.invoke("set_window_theme", { dark });
        } catch (e) {}
      }

      (function () {
        var p = null;
        try {
          p = new URLSearchParams(location.search).get("theme");
        } catch (e) {}
        if (!p) {
          try {
            p = localStorage.getItem("dsh-theme");
          } catch (e) {}
        }
        applyTheme(p || "system");
        try {
          localStorage.setItem("dsh-theme", p || "system");
        } catch (e) {}
      })();
    </script>
    <style>
      /* Mirrors dsh's own boot screen (ui-theme boot styles) so the desktop
         splash and dsh's "Loading plugins…" page read as one surface. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        --dsh-boot-bg: #fff;
        --dsh-boot-label-primary: #0f1115;
        --dsh-boot-label-tertiary: #81858c;
        --dsh-boot-border: rgb(0 0 0 / 10%);
        --dsh-boot-brand: #0f1115;
        --dsh-boot-error: #d92d20;
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        height: 100%;
        display: grid;
        place-items: center;
        user-select: none;
      }
      body[data-ds-dark-theme],
      html[data-ds-dark-theme] body {
        --dsh-boot-bg: #151517;
        --dsh-boot-label-primary: #f9fafb;
        --dsh-boot-label-tertiary: #adb2b8;
        --dsh-boot-border: rgb(255 255 255 / 12%);
        --dsh-boot-brand: #f9fafb;
        --dsh-boot-error: #fca5a5;
        color-scheme: dark;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .wordmark {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--dsh-boot-label-primary);
      }
      .spinner {
        position: relative;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--dsh-boot-border);
        animation: spin 0.8s linear infinite;
      }
      .spinner::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        background: conic-gradient(var(--dsh-boot-brand) 72deg, transparent 0);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 12px;
        line-height: 18px;
        color: var(--dsh-boot-label-tertiary);
      }
      #error {
        display: none;
        font-size: 12px;
        line-height: 18px;
        color: var(--dsh-boot-error);
        white-space: pre-line;
        max-width: 480px;
        font-family: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, Menlo, "PingFang SC",
          "Microsoft YaHei", monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wordmark">HARNESS</div>
      <div class="spinner"></div>
      <div id="status">Starting service…</div>
      <div id="error"></div>
    </div>
    <script>
      // Apply the theme before first paint: last persisted preference wins,
      // "system" (and an empty cache) resolves against the OS setting.
      function applyTheme(preference) {
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.setAttribute("data-ds-dark-theme", "");
          document.body.setAttribute("data-ds-dark-theme", "");
        } else {
          document.documentElement.removeAttribute("data-ds-dark-theme");
          document.body.removeAttribute("data-ds-dark-theme");
        }
      }

      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");

      let themePreference = null;
      try {
        themePreference =
          new URLSearchParams(location.search).get("theme") ||
          localStorage.getItem("dsh-theme");
      } catch (e) {}

      const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
      document.documentElement.lang = zh ? "zh-CN" : "en";

      const LABELS = zh
        ? {
            installing: "首次运行：正在安装运行时依赖（约 1 分钟，需要网络）…",
            starting: "正在启动 DeepSeek Harness 服务…",
            ready: "服务已就绪，正在打开界面…",
            failed: (msg) =>
              "启动失败：" + msg + "\n\n请通过菜单「服务 → 打开日志目录」查看详情，然后重启应用。",
          }
        : {
            installing: "First run: installing runtime dependencies (~1 min, network required)…",
            starting: "Starting DeepSeek Harness service…",
            ready: "Service ready, opening the interface…",
            failed: (msg) =>
              "Startup failed: " + msg + "\n\nSee Service → Open Logs Folder for details, then relaunch.",
          };

      statusEl.textContent = zh ? "正在启动服务…" : "Starting service…";

      async function poll() {
        const tauri = window.__TAURI__;
        if (!tauri || !tauri.core) {
          // IPC unavailable: stay on the static hint; Rust will navigate on its own.
          statusEl.textContent = zh ? "正在启动 DeepSeek Harness 服务…" : "Starting DeepSeek Harness service…";
          return;
        }
        try {
          const s = await tauri.core.invoke("boot_status");
          if (s && s.phase) {
            if (s.theme && s.theme !== themePreference) {
              themePreference = s.theme;
              applyTheme(s.theme);
              try {
                localStorage.setItem("dsh-theme", s.theme);
              } catch (e) {}
            }
            statusEl.textContent = LABELS[s.phase] || s.phase;
            if (s.phase === "failed") {
              document.querySelector(".spinner").style.display = "none";
              errorEl.style.display = "block";
              errorEl.textContent = LABELS.failed(s.message || "");
            }
          }
        } catch (e) {
          // ignore transient IPC errors
        }
      }

      poll();
      setInterval(poll, 500);
    </script>
  </body>
</html>
